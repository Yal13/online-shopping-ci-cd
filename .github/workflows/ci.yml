name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: ShopEasy CI Pipeline
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install backend dependencies
      - name: 3. Install backend dependencies
        working-directory: ./backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 4. Validate backend
      - name: 4. Validate backend
        run: |
          echo "Validating backend server syntax..."
          node -c backend/server.js
          echo "Validating product catalog JSON schema..."
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('./backend/data/products.json', 'utf8'));
            if (!Array.isArray(data) || data.length < 50) {
              throw new Error('Invalid products dataset: Expected at least 50 products');
            }
            console.log('✓ Products dataset valid. Total products: ' + data.length);
          "

      # 5. Run backend tests
      - name: 5. Run backend tests
        working-directory: ./backend
        run: npm test

      # 6. Validate frontend
      - name: 6. Validate frontend
        run: |
          echo "Checking essential frontend files..."
          test -f frontend/index.html || { echo "Missing frontend/index.html"; exit 1; }
          test -f frontend/style.css || { echo "Missing frontend/style.css"; exit 1; }
          test -f frontend/app.js || { echo "Missing frontend/app.js"; exit 1; }
          echo "✓ Frontend files verified successfully."

      # 7. Validate JavaScript
      - name: 7. Validate JavaScript
        run: |
          echo "Checking frontend JavaScript syntax..."
          node -c frontend/app.js
          echo "✓ JavaScript syntax check passed."

      # 8. Final project check
      - name: 8. Final project check
        run: |
          echo "=========================================="
          echo "  ShopEasy CI Pipeline Passed Successfully!"
          echo "=========================================="
